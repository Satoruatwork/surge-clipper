name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: ./packaging/build.ps1 -Version $env:REF_NAME

      - name: Manifest and small update from the previous release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The app updates itself from a patch zip holding only the files that changed since its version: one patch
          # from each of the last three releases, so skipping a version or two still gets a small update.
          $version = $env:REF_NAME.TrimStart('v')
          python packaging/patch.py manifest build/dist/Surge build/installer/manifest.json --version $version
          $prevs = @(gh release list --limit 20 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne $env:REF_NAME } | Select-Object -First 3)
          if (-not $prevs) { Write-Host "No earlier release: no small update."; exit 0 }
          foreach ($prev in $prevs) {
            $d = "build/prev/$prev"
            New-Item -ItemType Directory -Force $d | Out-Null
            gh release download $prev -p manifest.json -D $d 2>$null
            if (-not (Test-Path "$d/manifest.json")) {
              # a release from before manifests: install it into a scratch folder and list its files
              gh release download $prev -p 'Surge-Setup-*.exe' -D $d
              $setup = Get-Item "$d/Surge-Setup-*.exe"
              $dir = Join-Path $env:RUNNER_TEMP "install-$prev"
              $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList @(
                '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/MERGETASKS=!desktopicon', "/DIR=$dir")
              if ($p.ExitCode -ne 0) { throw "Installing $prev for comparison failed (exit code $($p.ExitCode))" }
              python packaging/patch.py manifest $dir "$d/manifest.json" --version $prev
              Remove-Item $setup.FullName
            }
            python packaging/patch.py patch build/dist/Surge "$d/manifest.json" build/installer --from $prev --to $version
          }
          Get-ChildItem build/installer/Surge-Patch-*.zip, build/installer/manifest.json | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) *$($_.Name)" |
              Add-Content build/installer/SHA256SUMS.txt -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: surge-installer
          path: build/installer/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Releases are immutable: create it, or add the installer when the release exists without one. Never overwrite.
          $setup = Get-Item build/installer/Surge-Setup-*.exe
          # Notes: the CHANGELOG.md section for this version (shown in the app's "What's new"), else GitHub's own list.
          $version = $env:REF_NAME.TrimStart('v')
          $inSection = $false
          $notes = foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+(\S+)') { $inSection = ($Matches[1] -eq $version); continue }
            if ($inSection) { $line }
          }
          $notes = ($notes -join "`n").Trim()
          if ($notes) {
            $notes += "`n`nIn Surge, Update now downloads only the files that changed (the Surge-Patch zip) and restarts by itself. Or run the installer: Surge updates in place. If Windows SmartScreen warns about an unknown publisher, choose More info, then Run anyway. The SHA-256 of every file is in SHA256SUMS.txt."
            $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
            Set-Content $notesFile $notes -Encoding utf8
            $noteArgs = @('--notes-file', $notesFile)
          } else { $noteArgs = @('--generate-notes') }
          $extra = @(Get-ChildItem build/installer/Surge-Patch-*.zip, build/installer/manifest.json -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName })
          $assets = gh release view $env:REF_NAME --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:REF_NAME $setup.FullName build/installer/SHA256SUMS.txt @extra --verify-tag --title "Surge $env:REF_NAME" @noteArgs
          } elseif ($assets -notcontains $setup.Name) {
            gh release upload $env:REF_NAME $setup.FullName build/installer/SHA256SUMS.txt @extra
          } else {
            Write-Host "Release $env:REF_NAME already has $($setup.Name); leaving it as is."
          }
